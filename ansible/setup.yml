---
- name: Prepare the application server
  hosts: application
  become: true
  tasks:
    - name: Require a supported server
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Ubuntu', 'Debian']
          - ansible_architecture == 'x86_64'
        fail_msg: This setup supports Ubuntu/Debian x86_64; current CI images are amd64.

    - name: Install repository prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, python3-debian]
        state: present
        update_cache: true

    - name: Add the official Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
        suites: ["{{ ansible_distribution_release }}"]
        components: [stable]
        architectures: [amd64]
        signed_by: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        state: present

    - name: Install Docker and Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create protected deployment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - /opt/devsync
        - /opt/devsync/releases

    - name: Install runtime secrets from Jenkins file credential
      ansible.builtin.copy:
        src: "{{ lookup('env', 'RUNTIME_ENV_FILE') }}"
        dest: /opt/devsync/runtime.env
        owner: root
        group: root
        mode: '0600'
      no_log: true
